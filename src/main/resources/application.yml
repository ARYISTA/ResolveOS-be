# ─── ResolvOS Backend — base config ──────────────────────────────────────────
spring:
  application:
    name: resolvos-backend

  # Virtual threads (Java 21 Loom)
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resolvos}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ResolvOS-Pool
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resolvos}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    locations: classpath:db/migration
    placeholders:
      embedding_dimensions: 768
    out-of-order: false
    validate-on-migrate: true

  security:
    # Disable auto-configured resource server so we configure manually
    oauth2:
      resourceserver:
        jwt:
          # We configure NimbusJwtDecoder in SecurityConfig directly
          issuer-uri: ""

# ─── Application properties ───────────────────────────────────────────────────
resolvos:
  jwt:
    secret: ${JWT_SECRET}               # ≥ 32 bytes; startup fails if absent/short
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  cors:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  rag:
    chunk-size-tokens: 400
    chunk-overlap-tokens: 60
    top-k: 4
  embedding:
    provider: ${EMBEDDING_PROVIDER:sim}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: 768
    base-url: ${EMBEDDING_BASE_URL:http://localhost:8000/v1}
  storage:
    base-dir: ${POLICY_STORAGE_DIR:./data/policies}

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.resolvos: DEBUG
    org.flywaydb: INFO
